<style>
  :root{
    --bg:#0d0f12;
    --panel:#15181d;
    --panel2:#1d2128;
    --line:#2b313a;
    --text:#f3f5f7;
    --muted:#9aa4b2;
    --accent:#f2c14e;
    --accent2:#e07a5f;
    --ok:#7ec8a5;
    --shadow:0 18px 60px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0a0c0f,#11141a 50%,#0a0c0f);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
  button,input,select{font:inherit}
  .app-shell{max-width:1400px;margin:0 auto;padding:28px 24px 60px}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
  .eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--accent);font-weight:700}
  h1{font-size:42px;line-height:1;margin:8px 0 0}
  h2{font-size:28px;margin:0 0 16px}
  h3{font-size:18px;margin:0 0 8px}
  .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow:auto}
  .tab{border:0;background:transparent;color:var(--muted);padding:14px 18px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .panel{display:none}.panel.active{display:block}
  .ghost-btn,.secondary-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}
  .primary-btn{border:0;background:var(--accent);color:#161616;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}
  .danger-btn{border:1px solid #5b3740;background:transparent;color:#f3b6c0;border-radius:10px;padding:10px 14px;cursor:pointer}
  .kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:26px}
  .kpi{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .kpi .value{font-size:30px;font-weight:800;letter-spacing:-.03em}.kpi .label{color:var(--muted);font-size:13px;margin-top:4px}
  .hero-rec{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:28px;background:linear-gradient(135deg,#171b21,#222831);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px}
  .cover-wrap{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#242934,#11151b);display:flex;align-items:center;justify-content:center;position:relative}
  .cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-fallback{padding:22px;text-align:center;color:#c8d0da;font-weight:700;font-size:20px}
  .rec-meta{display:flex;flex-direction:column;justify-content:center}
  .rec-meta .overline{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-weight:800}
  .rec-title{font-size:38px;line-height:1.05;margin:10px 0 5px;letter-spacing:-.035em}.rec-artist{font-size:22px;color:#d7dce2;margin-bottom:14px}
  .meta-line{color:var(--muted);margin:4px 0}.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.chip{background:#252b34;border:1px solid #343c47;border-radius:999px;padding:7px 10px;font-size:12px;color:#dbe0e5}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .secondary-recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
  .mini-rec,.album-card,.artist-card,.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mini-rec{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:12px;cursor:pointer}.mini-rec .cover-wrap{border-radius:10px}.mini-rec h3{font-size:16px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0}.muted{color:var(--muted)}
  .filterbar{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:18px}.filterbar input,.filterbar select{width:100%;background:#111419;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px}
  .album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.album-card{cursor:pointer;transition:transform .15s ease,border-color .15s ease}.album-card:hover{transform:translateY(-3px);border-color:#424b58}.album-card .cover-wrap{border-radius:0}.album-body{padding:12px}.album-title{font-weight:760;font-size:15px;line-height:1.25}.album-artist{font-size:13px;color:var(--muted);margin-top:4px}.album-extra{font-size:12px;color:#7f8997;margin-top:8px}
  .artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.artist-card{padding:16px;cursor:pointer}.artist-card:hover{border-color:#424b58}.artist-stats{display:flex;gap:18px;color:var(--muted);font-size:13px;margin-top:10px}
  .stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.chart-card{padding:18px}.bar-list{display:flex;flex-direction:column;gap:9px}.bar-row{display:grid;grid-template-columns:minmax(110px,1fr) 3fr 44px;align-items:center;gap:10px;font-size:13px}.bar-track{height:9px;background:#242a32;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px}.bar-value{text-align:right;color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}.modal.hidden{display:none}.modal-card{position:relative;background:#14181e;border:1px solid var(--line);border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow);padding:26px}.modal-close{position:absolute;right:14px;top:10px;border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:280px 1fr;gap:24px}.detail-list{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin-top:18px;font-size:14px}.detail-list .k{color:var(--muted)}
  .toast{position:fixed;right:20px;bottom:20px;background:#252b34;color:#fff;border:1px solid #3b4450;padding:12px 16px;border-radius:10px;z-index:80}.toast.hidden{display:none}
  .loader-wrap{position:fixed;inset:0;background:#0d0f12;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:100;color:var(--muted)}.loader{width:34px;height:34px;border:3px solid #303641;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
  @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.hero-rec{grid-template-columns:1fr}.hero-rec .cover-wrap{max-width:480px;width:100%;margin:auto}.filterbar{grid-template-columns:1fr 1fr}.stats-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.detail-grid .cover-wrap{max-width:360px}.rec-title{font-size:32px}}
  @media(max-width:560px){.app-shell{padding:20px 14px 40px}.kpi-grid{grid-template-columns:1fr 1fr}.filterbar{grid-template-columns:1fr}.album-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-row{grid-template-columns:100px 1fr 36px}.detail-list{grid-template-columns:1fr}.topbar{align-items:center}h1{font-size:34px}}
</style>
